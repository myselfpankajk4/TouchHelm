<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>

  <!-- Mouse Body Shape -->
  <rect x="146" y="96" width="220" height="320" rx="110" fill="none" stroke="url(#accentGrad)" stroke-width="24" filter="url(#glow)"/>

  <!-- Left/Right Click Divider -->
  <line x1="256" y1="96" x2="256" y2="210" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round"/>

  <!-- Center Scroll Wheel -->
  <rect x="236" y="140" width="40" height="70" rx="20" fill="#38bdf8"/>

  <!-- Subtle Laser Pointer Dot at bottom -->
  <circle cx="256" cy="330" r="16" fill="#ef4444" filter="url(#glow)"/>
</svg>
